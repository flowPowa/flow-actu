name: Essai technique (articles payants)

# Se lance uniquement à la main : onglet Actions > ce workflow > « Run workflow »
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Lancer l'essai
        run: python3 essai/essai_technique.py

      - name: Garder les résultats bruts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-essai
          path: resultats-essai.json
          if-no-files-found: ignore
